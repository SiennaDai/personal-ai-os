# Personal AI-OS Integration settings. Copy this file to:
# ~/.config/personal-ai-os/integrations.toml
#
# This file contains no secrets. If Web API access is enabled, provide the API
# key through the named environment variable instead of putting it in TOML.

[zotero]
# The official local API is the default read backend. Zotero must be running and
# Settings -> Advanced -> "Allow other applications on this computer to
# communicate with Zotero" must be enabled.
read_backend = "local"
# "auto" uses the Windows system curl bridge when this server runs inside WSL,
# keeping Zotero bound to Windows loopback instead of exposing port 23119.
local_transport = "auto" # "auto", "direct", or "windows"
library_alias = "personal"
library_type = "user"
local_library_id = "0"
local_api_url = "http://127.0.0.1:23119/api"

# Web reads are optional. Web writes require the numeric Zotero user/group ID,
# a write-capable API key in the environment variable below, and write_enabled.
web_library_id = ""
web_api_url = "https://api.zotero.org"
api_key_env = "ZOTERO_API_KEY"

# Better BibTeX is optional and is used only for read-only citation-key lookup.
better_bibtex_enabled = true
better_bibtex_url = "http://127.0.0.1:23119/better-bibtex/json-rpc"
better_bibtex_library_id = ""

# Writes are intentionally off. To enable them, configure the Web API fields,
# choose exactly one scope, and separately configure Codex to prompt for writes.
write_enabled = false
write_scope = "disabled" # "disabled", "collections", or "library"
allowed_write_collection_keys = []

request_timeout_seconds = 10
max_page_size = 50
max_fulltext_chars = 20000
max_note_chars = 50000
max_backend_response_bytes = 25000000

[obsidian]
# Replace this example path with one local Vault during deployment. The sync
# command validates it before serving tools and keeps all native values local.
vault_alias = "knowledge"
vault_path = "/path/to/Obsidian/Vault"

# Read scope may cover the Vault. Hidden paths and .obsidian/.trash/.git remain
# denied regardless of these roots. All paths are Vault-relative and use '/'.
read_roots = ["."]

# Writes are off and have no scope by default. Enabling writes requires one or
# more non-root subdirectories, separate Codex write approval, and explicit
# publication authorization for each operation.
write_enabled = false
allowed_write_roots = []

# The official CLI is an optional semantic plane for Obsidian query search,
# links/backlinks, and parsed properties. Configure an absolute executable and
# a native Vault name or ID locally; neither value belongs in Git. The adapter
# will allowlist exact read commands and never pass through arbitrary CLI input.
cli_enabled = false
cli_command = ""
cli_vault_selector = ""
cli_timeout_seconds = 30

max_page_size = 50
max_note_bytes = 2000000
max_read_chars = 50000
max_search_files = 10000
max_search_bytes = 64000000
max_link_results = 200
max_cli_response_bytes = 8000000
